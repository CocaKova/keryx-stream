<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="keryx-stream: Hermes hook events and forwarded worker events go into one hub on port 8646, which streams them to the Keryx app over SSE and relays every other path to the API server"><rect width="1200" height="340" rx="16" fill="#ffffff" stroke="#d0d7de"/><text x="60" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#1f2328">keryx-stream</text><text x="60" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">A Hermes plugin that streams each agent turn live to the Keryx app. No core patches.</text><rect x="60" y="150" width="250" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="185.0" y="177.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">Hermes gateway</text><text x="185.0" y="198.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">observer hooks</text><rect x="60" y="248" width="250" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="185.0" y="275.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">hermes chat · cron</text><text x="185.0" y="296.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">other processes</text><rect x="470" y="150" width="260" height="160" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="600.0" y="226.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">keryx-stream</text><text x="600.0" y="247.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">hub · :8646 · bearer auth</text><rect x="890" y="150" width="250" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1015.0" y="177.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">Keryx app</text><text x="1015.0" y="198.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">renders the turn live</text><rect x="890" y="248" width="250" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1015.0" y="275.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">Hermes API server</text><text x="1015.0" y="296.0" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">/health · /v1/* · /api/*</text><line x1="310" y1="181.0" x2="463.0" y2="181.0" stroke="#656d76" stroke-width="1.8"/><path d="M462.0,186.0 L470,181.0 L462.0,176.0 Z" fill="#656d76"/><text x="390.0" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#656d76">turn events</text><line x1="310" y1="279.0" x2="463.0" y2="279.0" stroke="#656d76" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M462.0,284.0 L470,279.0 L462.0,274.0 Z" fill="#656d76"/><text x="390.0" y="270.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#656d76">POST /keryx/publish</text><line x1="730" y1="181.0" x2="883.0" y2="181.0" stroke="#8250df" stroke-width="1.8"/><path d="M882.0,186.0 L890,181.0 L882.0,176.0 Z" fill="#8250df"/><text x="810.0" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8250df">SSE /keryx/stream</text><line x1="730" y1="279.0" x2="883.0" y2="279.0" stroke="#656d76" stroke-width="1.8"/><path d="M882.0,284.0 L890,279.0 L882.0,274.0 Z" fill="#656d76"/><text x="810.0" y="270.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#656d76">relay the rest</text></svg>