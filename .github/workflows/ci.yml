name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"   # nightly: catch hermes-agent main drifting under us
  workflow_dispatch:

jobs:
  unit:
    # The plugin on its own: lint + the tests that need no Hermes tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' ruff
      - run: ruff check .
      - run: pytest -q

  against-hermes-main:
    # The whole suite inside a fresh hermes-agent main: panel routes against
    # Hermes' real config defaults / kanban / skills code,
    # every Hermes import this package makes (static, see tests/test_hermes_compat.py), and the hook names we register.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.13"
      - name: Install hermes-agent from its lockfile, then the plugin
        # Install Hermes the way it installs itself: from uv.lock, which carries the
        # [tool.uv] dependency overrides that plain pip ignores (pip cannot resolve
        # hermes-agent main on its own). Python 3.14 because hermes-agent declares its
        # dependencies for >= 3.14 only. The venv lives outside the clone.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/hermes-venv
        run: |
          uv sync --frozen --no-dev --python 3.14 --project hermes-agent
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" -e '.[dev]'
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
      - name: Tests against hermes-agent main
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          git -C hermes-agent log --oneline -1
          pytest -q -rs
